<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fichas NPP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&display=swap" rel="stylesheet">
<style>
:root{--cr:#F3EEE6;--pe:#2F5D73;--ne:#D5E2E8;--mo:#D9A13B;--tx:#1F2A30;--hl:#F6E8C8;--ln:#B9C9D1;--mut:#5d6f78;--fo:#fffdf9;
--tit:'Bricolage Grotesque','Trebuchet MS',sans-serif;--body:'Atkinson Hyperlegible','Segoe UI',sans-serif}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cr);color:var(--tx);font:17px/1.5 var(--body)}
button,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--mo);outline-offset:2px}
.app{display:grid;grid-template-columns:300px 1fr;min-height:100vh}
/* trilho */
.rb{display:block;width:100%;text-align:left;min-height:46px;margin:0 0 8px;padding:8px 12px;border:1.5px solid #6f93a5;border-radius:10px;background:transparent;color:#fff;cursor:pointer;font-weight:700}
.rb:hover{background:#3a6c84}.rb[aria-pressed=true]{border-color:var(--mo)}
dialog{border:0;border-radius:14px;padding:0;max-width:min(720px,94vw);width:100%;background:var(--fo);color:var(--tx);box-shadow:0 20px 60px -10px rgba(0,0,0,.5)}
dialog::backdrop{background:rgba(31,42,48,.55)}
#dlgbox{padding:20px 24px 24px;max-height:86vh;overflow:auto}
#dlgbox h2{font:700 26px var(--tit);color:var(--pe);margin:0 0 8px}
.aplic{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.aplic select{min-height:44px;border:1.5px solid var(--pe);border-radius:22px;padding:6px 14px;background:#fff;font-size:16px}
.rail{position:sticky;top:0;height:100vh;overflow:auto;background:var(--pe);color:#fff;padding:22px 16px 28px}
.rail h1{font:700 22px/1.15 var(--tit);margin:0 6px 4px}
.rail .sub{margin:0 6px 18px;color:#cfe0e8;font-size:14px}
.pac{margin:0 0 18px}
.pac label{display:block;font-size:13px;color:#cfe0e8;margin-bottom:2px}
.nav{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.nav button{width:100%;text-align:left;background:transparent;border:0;border-radius:10px;color:#fff;padding:10px 10px 10px 12px;min-height:52px;display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;cursor:pointer}
.nav button:hover{background:#3a6c84}
.nav button[aria-current=true]{background:var(--cr);color:var(--tx)}
.nav .t{font-weight:700;font-size:15.5px;line-height:1.2}
.nav .s{font-size:13px;opacity:.85;grid-column:1}
.nav .bar{grid-column:1/-1;height:4px;border-radius:3px;background:rgba(255,255,255,.22);overflow:hidden;margin-top:4px}
.nav button[aria-current=true] .bar{background:var(--ne)}
.nav .bar i{display:block;height:100%;width:0;background:var(--mo);transition:width .25s}
.nav .pct{font:700 14px var(--tit)}
.estado{margin-top:18px;font-size:13.5px;color:#cfe0e8;padding:0 6px}
.estado b{color:#fff}
/* folha */
main{padding:28px clamp(16px,4vw,56px) 80px;min-width:0}
.folha{max-width:900px;margin:0 auto;background:var(--fo);border-radius:6px 6px 14px 14px;box-shadow:0 1px 0 #e4dccf,0 12px 30px -18px rgba(31,42,48,.35);border-top:8px solid var(--pe)}
.fh{padding:26px clamp(18px,4vw,44px) 8px}
.fh .rot{color:var(--mut);font-size:15px;margin:0}
.fh h2{font:700 clamp(26px,3.6vw,36px)/1.1 var(--tit);margin:4px 0 8px;color:var(--pe);letter-spacing:-.01em}
.fh .intro{margin:0;max-width:62ch}
.fb{padding:6px clamp(18px,4vw,44px) 30px}
.bloco{margin:26px 0 0}
h3{font:700 20px/1.2 var(--tit);color:var(--pe);margin:34px 0 4px;padding-bottom:6px;border-bottom:2px solid var(--ne)}
h3+.lead-p{margin:6px 0 0;color:var(--mut)}
.lead{font-weight:700;margin:22px 0 8px}
.note{background:var(--hl);border-left:5px solid var(--mo);padding:12px 16px;border-radius:0 8px 8px 0;margin:16px 0}
.legend,.src{font-size:14px;color:var(--mut);margin:8px 0}
.guide{border:1.5px solid var(--ln);border-radius:10px;padding:12px 16px;margin:10px 0}
.guide b{font-family:var(--tit)}
/* campos */
.fields{display:grid;gap:18px 22px;margin:16px 0}
.fld{display:block}
.fld>span{display:block;font-size:14.5px;color:var(--mut);margin-bottom:2px}
.fld input{width:100%;min-height:44px;padding:8px 2px;border:0;border-bottom:2px dashed var(--ln);background:transparent;border-radius:0;font-size:18px}
.fld input:focus{border-bottom:2px solid var(--pe);background:var(--ne)}
.fld input:not(:placeholder-shown){border-bottom-style:solid;border-bottom-color:var(--pe)}
/* pauta (texto longo) */
.pauta{display:block;margin:16px 0}
.pauta>span{display:block;font-weight:700;margin-bottom:4px}
.pauta small{display:block;color:var(--mut);margin:-2px 0 4px}
.pauta textarea{display:block;width:100%;border:0;resize:vertical;background:
 repeating-linear-gradient(to bottom,transparent 0,transparent 35px,var(--ln) 35px,var(--ln) 36px);
 line-height:36px;padding:0 4px;font-size:18px;min-height:var(--min);border-radius:0;border-left:3px solid var(--mo)}
.pauta textarea:focus{background-color:#fbf6ea;outline:none;box-shadow:0 0 0 3px var(--ne)}
/* segmentados */
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;min-width:46px;padding:8px 16px;border:1.5px solid var(--pe);background:#fff;color:var(--pe);border-radius:23px;cursor:pointer;font-size:16.5px;line-height:1.15;transition:background .12s,color .12s,transform .12s}
.seg button:hover{background:var(--ne)}
.seg button[aria-checked=true]{background:var(--pe);color:#fff;font-weight:700}
.seg button:active{transform:scale(.97)}
.seg.multi button[aria-checked=true]::before{content:"✓ "}
.lin{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 18px;align-items:center;padding:12px 0;border-bottom:1px dashed var(--ln)}
.lin.q{grid-template-columns:1fr}
.lin .lab{display:flex;gap:10px}
.lin .num{font:700 15px var(--tit);color:var(--mo);min-width:1.6em;padding-top:2px}
.lin .obs{grid-column:1/-1}
.lin .obs input{width:100%;border:0;border-bottom:1.5px dashed var(--ln);background:transparent;min-height:40px;font-size:16px;padding:6px 2px}
.lin .obs input:focus{border-bottom:2px solid var(--pe);outline:none;background:var(--ne)}
.mhead{font-size:14.5px;color:var(--mut);margin:14px 0 0}
@media (max-width:760px){.lin{grid-template-columns:1fr}}
/* tabela em cartões */
.cards{display:grid;gap:12px;margin:14px 0}
.tc{border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;background:#fff;display:grid;gap:10px}
.tc.ok{border-color:var(--pe)}
.tc>.nome{font:700 18px var(--tit);color:var(--pe)}
.tc .est{background:var(--cr);border-radius:8px;padding:8px 12px}
.tc .est small{display:block;color:var(--mut);font-size:13.5px}
.tc .row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;align-items:end}
.soma{display:flex;flex-wrap:wrap;gap:8px 20px;background:var(--hl);border-radius:8px;padding:10px 14px;margin:6px 0;font-size:15.5px}
.soma b{font-family:var(--tit)}
/* rodapé */
.pe{display:flex;justify-content:space-between;gap:12px;margin-top:40px;padding-top:18px;border-top:2px solid var(--ne)}
.btn{min-height:50px;padding:10px 22px;border-radius:25px;border:1.5px solid var(--pe);background:#fff;color:var(--pe);cursor:pointer;font-weight:700}
.btn.pri{background:var(--pe);color:#fff}
.btn:hover{filter:brightness(.95)}
.btn[disabled]{opacity:.4;cursor:default}
.tag{display:inline-block;background:var(--ne);border-radius:6px;padding:1px 8px;font-size:14px;color:var(--pe);margin-left:6px}
.fsel{margin:0 6px 16px}.fsel label{display:block;font-size:13px;color:#cfe0e8;margin-bottom:3px}
.fsel select{width:100%;min-height:46px;border-radius:12px;border:1.5px solid rgba(255,255,255,.4);background:#3a6c84;color:#fff;padding:6px 10px;font-size:16px;font-weight:700}
.btn.mini{min-height:42px;padding:6px 16px;font-size:15px}
.des{margin:18px 0}.des .lab{font-weight:700;margin-bottom:6px}
.cv{display:block;width:100%;max-width:820px;border:2px solid var(--ln);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}
.des-pe{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-top:8px}
.figs{display:flex;flex-wrap:wrap;gap:14px;margin:16px 0}.fig{margin:0;border:1.5px solid var(--ln);border-radius:10px;padding:10px 14px;background:#fff;text-align:center}.fig figcaption{font-size:14px;color:var(--mut);margin-top:4px}
.cartoes{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.cartao{border:1.5px solid var(--ln);border-radius:8px;padding:8px 14px;background:#fff;font:700 15px var(--tit);letter-spacing:.05em}
.cartao-g{display:grid;place-items:center;min-height:240px;text-align:center;font-family:var(--tit);font-weight:700;color:var(--pe);background:#fff;border:2px solid var(--ln);border-radius:14px;padding:24px;letter-spacing:.08em;line-height:1.5;word-spacing:.4em}
.estimulo{margin:14px 0;display:grid;gap:10px;justify-items:start}.est-flash{font:700 34px var(--tit);color:var(--pe);border:2px solid var(--ln);border-radius:12px;padding:16px 28px;background:#fff;letter-spacing:.06em}.est-seq{font:700 22px var(--tit);letter-spacing:.14em;word-spacing:.5em;line-height:1.7;background:#fff;border:2px solid var(--ln);border-radius:12px;padding:14px 20px}
.dsg{display:flex;flex-wrap:wrap;gap:8px}
.tot{display:flex;flex-wrap:wrap;gap:12px 22px;align-items:end;justify-content:flex-end;margin:10px 0}.tot-sa{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:15px;color:var(--mut)}.tot-sa b{color:var(--pe);font-family:var(--tit);font-size:18px}
/* tablet / notebook estreito: trilho vira barra */
@media (max-width:1000px){
 .app{grid-template-columns:1fr}
 .rail{position:sticky;top:0;z-index:5;height:auto;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:8px 14px;align-items:center}
 .rail h1,.rail .sub,.estado{display:none}
 .pac{margin:0;order:2;display:flex;gap:8px}
 .rb{margin:0;white-space:nowrap}
 .nav{align-items:start;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);overflow-x:auto;grid-column:1/-1;order:3;padding-bottom:4px}
 .nav .s{display:none}
 .nav button{min-height:46px}
 main{padding-top:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media print{.rail,.pe{display:none}.app{display:block}.folha{box-shadow:none}}
</style>
</head>
<body>
<div class="app">
 <aside class="rail" aria-label="Seções da ficha">
  <h1 id="rt"></h1><p class="sub" id="rs"></p>
  <div class="fsel"><label for="fsel">Ficha</label><select id="fsel"></select></div>
  <div class="pac"><button id="bpac" class="rb" type="button">Escolher paciente</button><button id="bgoo" class="rb" type="button" aria-pressed="false">Entrar com o Google</button><button id="bexp" class="rb" type="button">Exportar PDF ou Doc</button></div>
  <ol class="nav" id="nav"></ol>
  <p class="estado" id="estado"></p>
 </aside>
 <dialog id="dlg"><div id="dlgbox"></div></dialog>
 <main><article class="folha" id="folha"></article></main>
</div>

function pedirToken(prompt){ return new Promise((ok,no)=>{
  if(!window.google||!google.accounts)return no(new Error('A biblioteca de login do Google não carregou. Verifique a conexão.'));
  tokClient=tokClient||google.accounts.oauth2.initTokenClient({client_id:CLIENT_ID,scope:SCOPE,callback:()=>{}});
  tokClient.callback=r=>{ if(r.error)return no(new Error(r.error)); token=r.access_token; tokenExp=Date.now()+(r.expires_in||3600)*1000-60000; conectado=true; ok(token) };
  tokClient.error_callback=e=>no(new Error(e.type||'login cancelado'));
  tokClient.requestAccessToken({prompt:prompt||''}); }) }
async function api(url,opt={},retry=true){
  if(!token||Date.now()>tokenExp){ await pedirToken(token?'':'consent') }
  const r=await fetch(url,{...opt,headers:{'Authorization':'Bearer '+token,'Content-Type':'application/json',...(opt.headers||{})}});
  if(r.status===401&&retry){ token=null; return api(url,opt,false) }
  if(!r.ok){ let m=r.statusText; try{m=(await r.json()).error.message}catch(e){} throw new Error(m) }
  return r.status===204?null:r.json();
}

async function garantirAba(id,nome){

  const r=await sbatch(id,[{addSheet:{properties:{title:nome,gridProperties:{frozenRowCount:2,frozenColumnCount:2}}}}]);

async function escolher(id,cod,cadNovo){
  try{ msg('Abrindo paciente…'); cad=cadNovo||await lerCadastro(id); pac={cod:cad.cod||cod,ini:cad.ini||'',sheetId:id}; safeSet('npp:pac',JSON.stringify({cod:pac.cod,ini:pac.ini}));
    load(); sections.forEach(s=>{s.appCol=null}); await prepararSecao(current); precompute(); show(current); chip(); msg('<b>Paciente aberto.</b> As respostas são enviadas para a planilha enquanto você preenche.') }
  catch(e){ msg('Não foi possível abrir o paciente: '+e.message,true) } }
async function prepararSecao(i){ const s=sections[i]; if(!s)return; s.ids=[];s.cat={};s.groups=[];s.lastH=''; s.nodes.forEach(({n,b})=>{const f=R[n.type]; if(f)f(n,b,s)}); try{ await carregarSecao(s) }catch(e){ msg('Não foi possível ler a planilha: '+e.message,true) } }

function graficoPNG(titulo,apps,opts){ // apps: [{nome, cont:[n por opção]}]
  const c=document.createElement('canvas'); c.width=1000; c.height=520; const x=c.getContext('2d');
  x.fillStyle='#fff'; x.fillRect(0,0,1000,520); x.fillStyle=PE; x.font='700 28px "Bricolage Grotesque","Trebuchet MS",sans-serif'; x.fillText(titulo,36,46);
  const cores=[PE,MOc,'#9fb3bd']; const max=Math.max(1,...apps.map(a=>a.cont.reduce((s,v)=>s+v,0)));
  const gx=90,gy=80,gw=860,gh=330; x.strokeStyle='#d0dbe0'; x.lineWidth=1; x.fillStyle='#5d6f78'; x.font='400 18px "Atkinson Hyperlegible",sans-serif';
  for(let i=0;i<=max;i++){ const y=gy+gh-gh*i/max; x.beginPath(); x.moveTo(gx,y); x.lineTo(gx+gw,y); x.stroke(); if(max<=12||i%Math.ceil(max/6)===0)x.fillText(String(i),gx-34,y+6) }
  const bw=Math.min(120,gw/apps.length*.55), step=gw/apps.length;
  apps.forEach((a,k)=>{ let acc=0; const bx=gx+step*k+(step-bw)/2; a.cont.forEach((v,j)=>{ if(!v)return; const h=gh*v/max; x.fillStyle=cores[j%3]; x.fillRect(bx,gy+gh-gh*acc/max-h,bw,h-1.5);
      if(h>22){ x.fillStyle=j===1?TX:'#fff'; x.font='700 18px "Atkinson Hyperlegible",sans-serif'; x.textAlign='center'; x.fillText(String(v),bx+bw/2,gy+gh-gh*acc/max-h/2+6); x.textAlign='left' } acc+=v });
    x.fillStyle=TX; x.font='400 18px "Atkinson Hyperlegible",sans-serif'; x.textAlign='center'; x.fillText(a.nome,bx+bw/2,gy+gh+30); x.textAlign='left' });
  let lx=gx; opts.forEach((o,j)=>{ x.fillStyle=cores[j%3]; x.fillRect(lx,468,18,18); x.fillStyle=TX; x.font='400 18px "Atkinson Hyperlegible",sans-serif'; x.fillText(o,lx+26,483); lx+=x.measureText(o).width+70 });
  return c.toDataURL('image/png'); }

const vv=id=>{const v=vals[id]; return v==null||v===''?'':(Array.isArray(v)?v.join('; '):String(v))};
const tb=(cab,linhas,larg)=>`<table class="t"><thead><tr>${cab.map((c,i)=>`<th${larg&&larg[i]?` width="${larg[i]}"`:''} style="background:${PE};color:#fff;text-align:left;padding:5px 8px;font-size:10pt">${esc(c)}</th>`).join('')}</tr></thead><tbody>${linhas.map((l,r)=>`<tr>${l.map((c,i)=>`<td style="border-bottom:1px solid ${NE};padding:5px 8px;font-size:10.5pt;vertical-align:top;${r%2?'background:#f7f4ee':''}">${c===''?'<span style="color:#9aa9b1">—</span>':c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
function htmlSecao(s,graficos){
  let h=`<h2 style="font-family:'Bricolage Grotesque','Trebuchet MS',sans-serif;color:${PE};font-size:20pt;margin:0 0 2pt">${esc(s.title)}</h2><p style="color:#5d6f78;margin:0 0 10pt;font-size:10pt">${esc(s.label)}${s.intro?' · '+esc(s.intro):''}</p>`;
  const cal=[]; let ult='';
  s.nodes.forEach(({n,b})=>{
    switch(n.type){
      case 'heading': h+=`<h3 style="color:${PE};font-size:13pt;margin:14pt 0 4pt;border-bottom:2px solid ${NE}">${esc(n.title)}</h3>`; ult=n.title; break;
      case 'lead': h+=`<p style="font-weight:700;margin:8pt 0 2pt">${n.text}</p>`; break;
      case 'note': h+=`<p style="background:${HL};border-left:4px solid ${MOc};padding:6px 10px;font-size:10pt">${n.text}</p>`; break;
      case 'fields': { const l=[]; n.labels.forEach((x,i)=>{const lab=typeof x==='object'?x.label:x; if(!lab||NOME_RE.test(lab))return; l.push([esc(lab),esc(vv(`${b}.f${i+1}`))])}); if(l.length)h+=tb(['Campo','Registro'],l,['38%']); break }
      case 'options': { const m=vv(`${b}.sel`); h+=`<p><b>Marcado:</b> ${m?esc(m):'<span style="color:#9aa9b1">—</span>'}${vv(`${b}.outro`)?'; outro: '+esc(vv(`${b}.outro`)):''}</p>`; break }
      case 'choice': h+=`<p><b>${esc(n.label)}:</b> ${esc(vv(`${b}.q`))||'<span style="color:#9aa9b1">—</span>'}${vv(`${b}.q_det`)?' · '+esc(vv(`${b}.q_det`)):''}</p>`; break;
      case 'scale': h+=`<p><b>Escala:</b> ${esc(vv(`${b}.esc`))||'—'}</p>`; break;
      case 'matrix': h+=tb([n.first||'Item','Resposta',...(n.obs?[n.obs]:[])],n.rows.map((r,i)=>[esc(r),esc(vv(`${b}.r${i+1}`)),...(n.obs?[esc(vv(`${b}.r${i+1}_obs`))]:[])]),['46%']); break;
      case 'table': { const cv=n.colvals||{}; const cab=[n.headers[0]||'Item']; const cols=[];
        for(let c=1;c<n.headers.length;c++){ const cell=n.cells[c]||n.cells[String(c)]; if(cell&&cell.checkbox)continue; cab.push(n.headers[c]); cols.push(c) }
        const chk=[]; for(let c=1;c<n.headers.length;c++){const cell=n.cells[c]||n.cells[String(c)]; if(cell&&cell.checkbox)chk.push(c)}
        if(chk.length>1) cab.push('Resultado');
        const lin=[]; for(let r=0;r<n.nrows;r++){ const nome=n.first_vals?n.first_vals[r]:String(r+1); const row=[esc(nome)];
          cols.forEach(c=>{ const st=cv[c]||cv[String(c)]; row.push(st?esc(st[r]):esc(vv(`${b}.l${r+1}c${c}`))) });
          if(chk.length>1) row.push(esc(vv(`${b}.l${r+1}g`))); else chk.forEach(c=>{});
          lin.push(row)}
        h+=tb(cab,lin); break }
      case 'text': { const v=vv(`${b}.t`); h+=`<p style="margin:6pt 0 2pt"><b>${esc(n.label)}</b></p><p style="margin:0 0 6pt;white-space:pre-wrap;border-left:3px solid ${MOc};padding-left:8px">${v?esc(v):'<span style="color:#9aa9b1">—</span>'}</p>`; break }
      case 'signature': { const l=n.items.map((x,i)=>[esc(x),esc(vv(`${b}.a${i+1}`))]); h+=tb(['Assinatura','Registro'],l); break }
      case 'drawing': { const id=`${b}.des`; h+=`<p style="margin:8pt 0 2pt"><b>${esc(n.label)}</b></p>`+(imgs[id]?`<p style="margin:0 0 6pt"><img src="${imgs[id]}" width="360" alt="Desenho: ${esc(n.label)}" style="max-width:100%;border:1px solid ${NE}"></p>`:'<p style="margin:0 0 6pt;color:#9aa9b1">—</p>'); break }
      case 'digitspan': h+=tb(['Dígitos','Séries repetidas corretamente'],n.rows.map(r=>[esc(r[0]),esc(r.slice(1).filter((x,k)=>vv(`${b}.d${r[0]}s${k+1}`)).join(' · '))||'—']),['22%']); break;
      case 'total': h+=`<p style="text-align:right"><b>${esc(n.label)}:</b> ${esc(vv(`${b}.total`))||'—'} / ${esc(n.max)}</p>`; break;
    }});
  if(graficos&&graficos[s.seq])h+=`<p style="margin:12pt 0 0"><img src="${graficos[s.seq]}" width="470" alt="Gráfico: ${esc(s.title)}" style="max-width:100%"></p>`;
  return h; }

async function contagensSecao(s){ // por aplicação, para seções com escolha por tarefa
  if(!s.groups||!s.groups.length)return null; const opts=s.groups[0].opts; const ids=s.groups.map(g=>g.id);
  if(ligado()){ try{ const meta=await smeta(pac.sheetId); if(meta.sheets.some(x=>x.properties.title===tabName(s))){ const cat=Object.keys(s.cat); const apps=await cabecalho(pac.sheetId,s);
      const r=await vget(pac.sheetId,`${q1(tabName(s))}!A3:${colL(Math.max(...apps.map(a=>a.col)))}${cat.length+2}`); const lin=r.values||[]; const out=apps.map(a=>({nome:`${a.nome||'Aplicação'}${a.data?' · '+a.data:''}`,cont:opts.map(o=>lin.filter(l=>ids.includes(l[0])&&l[a.col]===o).length)}));
      // aplicação em edição ainda não salva: substitui pela contagem local
      return {opts,apps:out} }}catch(e){} }
  return {opts,apps:[{nome:'Aplicação atual',cont:opts.map(o=>ids.filter(i=>vals[i]===o).length)}]}; }

async function montarRelatorio(escopo){
  const lista=escopo==='secao'?[sections[current]]:sections;
  if(escopo!=='secao'&&ligado()){ for(const s of lista){ try{ await carregarSecao(s) }catch(e){} } }
  // reconstruir catálogos (ids, grupos) de cada seção
  for(const s of lista){ s.ids=[];s.cat={};s.groups=[];s.lastH=''; s.nodes.forEach(({n,b})=>{const f=R[n.type]; if(f)f(n,b,s)}) }
  const graficos={}; for(const s of lista){ const c=await contagensSecao(s); if(c&&c.apps.some(a=>a.cont.some(v=>v))) graficos[s.seq]=graficoPNG(`${s.title}: respostas por aplicação`,c.apps,c.opts) }
  const capa=await capaPNG();
  const ROD='Registro de aplicação. Este documento reúne as respostas marcadas na ficha; não é laudo nem diagnóstico. Instrumentos de terceiros mantêm autoria e referências originais.';
  const corpo=lista.map((s,i)=>`<div class="sec">${htmlSecao(s,graficos)}${i===lista.length-1?`<p class="rod">${ROD}</p>`:''}</div>`).join('<br style="page-break-after:always">');
  const css=`@page{size:A4;margin:0}body{margin:0;font-family:'Atkinson Hyperlegible','Segoe UI',Arial,sans-serif;color:${TX};background:#fff}
   .capa{page-break-after:always;margin:0}.capa img{display:block;width:210mm;height:297mm}.corpo{padding:16mm 16mm 12mm}.sec{page-break-before:always;padding:16mm}.sec:first-child{page-break-before:auto}
   .t{width:100%;border-collapse:collapse;margin:4pt 0 8pt}.t tr{page-break-inside:avoid}p{margin:4pt 0}
   .rod{color:#5d6f78;font-size:9pt;margin-top:14pt;font-style:italic}`;
  const titulo=`${pac.cod||'Rascunho'} · ${pac.ini||''} — ${FICHA.meta.short} — ${hoje()}`;
  const html=`<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><title>${esc(titulo)}</title><style>${css}</style></head><body>
   <div class="capa"><img src="${capa}" alt="Capa: ${esc(FICHA.meta.title)}"></div>${corpo}</body></html>`;
  return {html,titulo}; }

async function exportarPDF(escopo){
  msg('Montando o PDF…'); const {html,titulo}=await montarRelatorio(escopo);
  const f=document.createElement('iframe'); f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0'; document.body.append(f);
  f.srcdoc=html; await new Promise(r=>f.onload=r); await new Promise(r=>setTimeout(r,500));
  const antes=document.title; f.contentWindow.focus(); f.contentWindow.print(); setTimeout(()=>f.remove(),60000);
  msg('<b>PDF pronto.</b> Na janela de impressão, escolha “Salvar como PDF” e ative “Gráficos de segundo plano”.'); return titulo; }
async function exportarDoc(escopo){
  if(!conectado) throw new Error('Entre com o Google para criar o documento.');
  msg('Montando o documento…'); const {html,titulo}=await montarRelatorio(escopo);
  const meta={name:titulo,mimeType:'application/vnd.google-apps.document',appProperties:{npp:'relatorio',cod:pac.cod||''}}; const bd='npp'+Date.now();
  const corpo=`--${bd}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${bd}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n${html}\r\n--${bd}--`;
  const r=await api('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,webViewLink',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${bd}`},body:corpo});
  msg('<b>Documento criado</b> no seu Google Drive.'); return r; }
function abrirExportar(){
  const dlg=$('#dlg'), box=$('#dlgbox'); let escopo='secao';
  const opcoes=[['Esta seção','secao'],['Ficha inteira','ficha']]; const g=el('div',{class:'seg',role:'radiogroup'});
  const pint=()=>[...g.children].forEach((b,k)=>b.setAttribute('aria-checked',opcoes[k][1]===escopo));
  opcoes.forEach(([t,v])=>g.append(el('button',{type:'button',role:'radio','aria-checked':'false',onclick:()=>{escopo=v;pint()}},t))); pint();
  const res=el('div',{'aria-live':'polite',style:'margin-top:12px'});
  const rodar=(fn)=>async()=>{ res.replaceChildren(el('p',{class:'legend'},'Trabalhando…')); try{ const r=await fn(escopo);
      res.replaceChildren(r&&r.webViewLink?el('p',{},'Documento criado: ',el('a',{href:r.webViewLink,target:'_blank',rel:'noopener'},r.name)):el('p',{class:'legend'},'Pronto.')) }catch(e){ res.replaceChildren(el('p',{class:'note'},'Não foi possível exportar: '+e.message)) } };
  box.replaceChildren(el('h2',{},'Exportar ficha preenchida'),el('p',{class:'lead'},'O que exportar'),g,
    el('div',{class:'pe',style:'margin-top:22px'},el('button',{class:'btn',type:'button',onclick:rodar(exportarPDF)},'Gerar PDF'),el('button',{class:'btn pri',type:'button',onclick:rodar(exportarDoc)},'Criar Google Doc')),res,
    el('div',{class:'pe'},el('button',{class:'btn',type:'button',onclick:()=>dlg.close()},'Fechar'),el('span')));
  dlg.showModal(); }

function montarNav(){ build(); const nav=$('#nav'); nav.replaceChildren();
  sections.forEach((s,i)=>nav.append(el('li',{},el('button',{type:'button',onclick:()=>go(i),'aria-current':'false'},
    el('span',{class:'t'},s.title),el('span',{class:'pct'}),el('span',{class:'s'},s.label),el('span',{class:'bar'},el('i')))))); }
async function trocarFicha(num){
  if(!FICHAS[num]||FICHAS[num]===FICHA)return;
  clearTimeout(saveT); safeSet(key(),JSON.stringify(vals)); salvarImgs();
  if(ligado()&&sections[current]&&sections[current].dirty){ clearTimeout(syncT); try{ await salvarSecao() }catch(e){ msg('Não foi possível salvar a seção anterior: '+e.message,true) } }
  FICHA=FICHAS[num]; safeSet('npp:ficha',num); current=0; load(); montarNav(); $('#rt').textContent=FICHA.meta.short; document.title=`${FICHA.meta.short} · NPP`;
  if(ligado()) await prepararSecao(0);
  precompute(); show(0); scrollTo({top:0}); }
function boot(){
  $('#rt').textContent=FICHA.meta.short; $('#rs').textContent='Registro durante a sessão';
  const fs=$('#fsel'); Object.values(FICHAS).sort((x,y)=>x.meta.num.localeCompare(y.meta.num)).forEach(F=>fs.append(el('option',{value:F.meta.num},`${F.meta.num} · ${F.meta.short}`))); fs.value=FICHA.meta.num; fs.addEventListener('change',()=>trocarFicha(fs.value));
  $('#bgoo').addEventListener('click',()=>conectado?abrirPaciente():entrar()); $('#bpac').addEventListener('click',abrirPaciente); $('#bexp').addEventListener('click',abrirExportar);
  chip(); load(); montarNav(); precompute(); show(0);
  $('#estado').innerHTML='<b>Salva neste aparelho.</b> Entre com o Google para enviar à planilha do paciente.';
}
boot();
